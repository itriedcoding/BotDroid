name: Build and release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotDroid-apk
          path: dist/BotDroid.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: "1.0"
        run: |
          TAG="v$VERSION"
          cat > release-notes.md <<'EOF'
          BotDroid - a tiny Discord bot that runs on your phone.

          Install the APK, paste your Discord bot token, press Start. The preset slash commands are registered in every server the bot is in.

          Commands: /help, /ping, /ban, /unban, /kick, /timeout, /purge, /slowmode, /say, /userinfo, /serverinfo, /avatar, /8ball, /roll

          Requires Android 8.0+. Bot invite needs the bot and applications.commands scopes.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/BotDroid.apk --clobber
          else
            gh release create "$TAG" dist/BotDroid.apk --title "BotDroid $TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
